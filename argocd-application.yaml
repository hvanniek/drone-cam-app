---
# ArgoCD Application for the drone-cam demo app.
#
# This chart auto-detects the Route API on the destination cluster (see
# values.yaml / templates/route.yaml), so the SAME Application manifest works
# unmodified against either:
#   - a managed OpenShift cluster (e.g. dev-acp4, once provisioned) -> Route created
#   - a managed MicroShift cluster (e.g. an rhde/fleet.yaml device) -> Service only
#
# Point destination.server/name at whichever managed cluster you're targeting.
# If the hub's ACM has the GitOpsCluster addon enabled, each ManagedCluster is
# auto-registered as an ArgoCD cluster secret named after the cluster, so
# destination.name can just be the ManagedCluster name (e.g. "dev-acp4" or the
# MicroShift device's cluster name/alias). Otherwise use destination.server
# with that cluster's API URL and a manually-registered `argocd cluster add`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: drone-cam
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/hvanniek/drone-cam-app.git
    targetRevision: main
    path: .

  destination:
    name: dev-acp2 # ManagedCluster/ArgoCD cluster secret name
    namespace: drone-cam

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
