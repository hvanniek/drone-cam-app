replicaCount: 1

image:
  repository: quay.io/kenosborn/drone-cam
  tag: v1
  pullPolicy: IfNotPresent

containerPort: 8081

service:
  type: ClusterIP
  port: 8081
  # Only used when service.type is NodePort — handy for reaching the app directly
  # on a MicroShift cluster that has no Route/Ingress controller.
  nodePort: null

route:
  # "auto" creates a Route only if the target cluster advertises the
  # route.openshift.io/v1 API (true on OpenShift, false on plain MicroShift).
  # ArgoCD populates Helm's .Capabilities from the destination cluster, so this
  # detection works per-Application without touching values per cluster type.
  # Set "true"/"false" to force it (e.g. a MicroShift cluster with the optional
  # route-controller-manager RPM installed).
  enabled: "auto"
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
