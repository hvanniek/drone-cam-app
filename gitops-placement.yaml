---
# Selects every ManagedCluster labeled application.drone-cam=true, from the
# abb-demo ClusterSet (where dev-acp2/dev-acp3/dev-acp4/snuc-ee2400 live).
# Adding/removing that label on a ManagedCluster is all it takes to add/remove
# it from the drone-cam rollout below.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: drone-cam-placement
  namespace: openshift-gitops
spec:
  clusterSets:
    - abb-demo
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            application.drone-cam: "true"
---
# Bridges the Placement above into ArgoCD's ApplicationSet clusterDecisionResource
# generator (the acm-placement ConfigMap in openshift-gitops maps OCM
# PlacementDecisions -> generator params, including {{name}} and {{server}}
# for each matched cluster's registered ArgoCD cluster secret).
#
# This is a PUSH-model rollout: the hub's own ArgoCD syncs directly to each
# matched cluster via destination.server, same as a plain Application. It does
# NOT use ACM's pull model (no skip-reconcile annotation / no
# pull-to-ocm-managed-cluster label), so the target cluster does not need
# OpenShift GitOps installed locally — only a registered ArgoCD cluster secret.
#
# service.type=NodePort is forced on every cluster (not just MicroShift) so
# there's always an IP:port way in, independent of whether a cluster's Route
# actually resolves. Some MicroShift devices (e.g. snuc-ee2400) have the
# optional route-controller-manager enabled but no real base domain configured
# for it, so their Route gets admitted under the placeholder apps.example.com
# and is not reachable by hostname — NodePort on the device's own IP sidesteps
# that entirely. Harmless on real OpenShift: the Route keeps working as well.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: drone-cam
  namespace: openshift-gitops
spec:
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: drone-cam-placement
        requeueAfterSeconds: 180
  template:
    metadata:
      name: "drone-cam-{{name}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/hvanniek/drone-cam-app.git
        targetRevision: main
        path: .
        helm:
          # Pinned so every cluster's resources are just named "drone-cam",
          # not "drone-cam-<cluster>-drone-cam" (the Application name above
          # needs the cluster suffix to stay unique within openshift-gitops,
          # but that has no bearing on naming inside each target cluster's own
          # namespace — each cluster is already its own namespace).
          releaseName: drone-cam
          values: |
            service:
              type: NodePort
              nodePort: 30081
      destination:
        server: "{{server}}"
        namespace: abb-demo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
